<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Smart washing machine">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ebf0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
    <clipPath id="drum">
      <circle cx="128" cy="150" r="52"/>
    </clipPath>
  </defs>

  <!-- machine body -->
  <rect x="36" y="20" width="184" height="216" rx="22" fill="url(#body)" stroke="#37474f" stroke-width="8"/>

  <!-- control panel -->
  <line x1="40" y1="76" x2="216" y2="76" stroke="#37474f" stroke-width="6"/>
  <circle cx="68" cy="48" r="11" fill="none" stroke="#37474f" stroke-width="6"/>
  <line x1="68" y1="48" x2="68" y2="40" stroke="#37474f" stroke-width="5" stroke-linecap="round"/>
  <rect x="94" y="40" width="34" height="16" rx="5" fill="#37474f"/>

  <!-- connectivity mark: this washer is remote controllable -->
  <g fill="none" stroke="#0288d1" stroke-width="7" stroke-linecap="round">
    <path d="M160 46 a26 26 0 0 1 40 0"/>
    <path d="M169 55 a14 14 0 0 1 22 0"/>
  </g>
  <circle cx="180" cy="63" r="5" fill="#0288d1"/>

  <!-- door -->
  <circle cx="128" cy="150" r="66" fill="#cfd8dc" stroke="#37474f" stroke-width="8"/>
  <circle cx="128" cy="150" r="52" fill="#eceff1"/>
  <g clip-path="url(#drum)">
    <path d="M60 152 q17 -16 34 0 t34 0 t34 0 t34 0 v60 h-136 z" fill="url(#water)"/>
    <circle cx="108" cy="128" r="6" fill="#81d4fa"/>
    <circle cx="146" cy="118" r="4" fill="#81d4fa"/>
    <circle cx="156" cy="136" r="5" fill="#81d4fa"/>
  </g>
  <circle cx="128" cy="150" r="52" fill="none" stroke="#37474f" stroke-width="6"/>
  <path d="M96 118 a44 44 0 0 1 30 -12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
</svg>
